[project]
name = "selah-api"
version = "0.1.0"
description = "Selah API — Bible reading, AI verse explanations, notes and favorites."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    # psycopg 3 is the async Postgres driver (better 3.13+/3.14 wheel coverage than asyncpg).
    "psycopg[binary]>=3.2",
    # aiosqlite powers the zero-config local default so the API runs before Docker does.
    "aiosqlite>=0.20",
    "pgvector>=0.3.6",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
